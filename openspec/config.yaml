schema: spec-driven

context: |
  Purpose: Build Cripto Farol, a cryptocurrency analysis, monitoring, and backtesting product with an auditable operational workflow.

  Tech Stack:
  - Backend: Python, FastAPI, PostgreSQL
  - Frontend: React, TypeScript, Vite
  - Integrations/data: exchange APIs, workers, market and backtest services

  Project Conventions:
  - PostgreSQL is mandatory for runtime, QA, and workflow state.
  - Follow DESIGN.md and the versioned brand system for every UI/UX change.
  - Status is the canonical Kanban field; Fluxo is secondary/legacy.

  Architecture Patterns:
  - FastAPI routes delegate business rules to services and repositories/workers.
  - React screens consume backend APIs; the frontend never accesses the database directly.
  - UI-impact work follows Design -> Aprovação de Design -> Pronto para Dev before implementation.

rules:
  tasks:
    - Include a short note reminding to use project skills available to Codex and Cursor when applicable (.agents/skills, .codex/skills, .cursor/skills).
    - For UI-impact work, include the design gate before implementation: Design -> Aprovação de Design -> Pronto para Dev, using the design-critic skill and waiting for Alan's human approval.
  design:
    - For UI-impact work, include Prototype and Design Critique sections with versioned evidence and an explicit Design Agent verdict.
    - The Designer/Critic Agent may hand off Design -> Aprovação de Design only; it must never approve Aprovação de Design -> Pronto para Dev.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
